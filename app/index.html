<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a5c8f">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>水印相机 · 拍照</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow:hidden}
body{font-family:-apple-system,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;background:#0b0f14;color:#fff;
  /* 四边钉在可视区上：不用 vh/dvh —— 老 iOS 与微信内核不认 dvh，写 100vh 会把底栏顶到工具栏后面 */
  position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:auto;max-height:100%;
  display:flex;flex-direction:column;overflow:hidden;user-select:none;
  overscroll-behavior:none;touch-action:manipulation;-webkit-overflow-scrolling:touch}
/* 顶部 App 栏 */
.appbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:calc(6px + env(safe-area-inset-top)) 12px 6px;
  background:#0b0f14;border-bottom:1px solid rgba(255,255,255,.06)}
.appbar .ic{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;color:#e8eef5;border-radius:12px}
.appbar .ic:active{background:rgba(255,255,255,.09)}
.appbar .ttl{flex:1;text-align:center;font-size:16px;font-weight:700;letter-spacing:.5px}
.appbar .ttl span{display:block;font-size:11px;font-weight:400;color:#8aa0b4;margin-top:2px}
.appbar .exit{font-size:12px;color:#8aa0b4;padding:8px 6px;text-decoration:none}
/* 版本/环境自证行 */
.verline{margin:14px 0 2px;padding-top:10px;border-top:1px dashed rgba(0,0,0,.12);font-size:11.5px;color:#98a2b3;line-height:1.7;word-break:break-all}
/* 相机权限指引 */
#camGuide{position:fixed;inset:0;z-index:70;background:rgba(4,8,12,.86);display:none;align-items:center;justify-content:center;padding:22px}
#camGuide .cg-card{background:#111a24;border:1px solid rgba(124,196,255,.3);border-radius:18px;padding:20px 18px;max-width:360px;width:100%;color:#eaf2fa;box-shadow:0 18px 50px rgba(0,0,0,.6)}
#camGuide h4{margin:0 0 10px;font-size:17px;color:#7cc4ff}
#camGuide .cg-why{font-size:13px;color:#ffd479;line-height:1.5;margin-bottom:8px}
#camGuide .cg-steps{font-size:13.5px;line-height:1.75;color:#dbe8f4}
#camGuide .cg-steps b{color:#7cc4ff}
#camGuide .cg-note{margin-top:12px;font-size:12px;color:#8aa0b4;line-height:1.6;border-top:1px dashed rgba(255,255,255,.12);padding-top:10px}
#camGuide .cg-btns{display:flex;gap:10px;margin-top:16px}
#camGuide button{flex:1;padding:11px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#eaf2fa;font-size:14px;font-weight:600}
#camGuide button.p{background:#1a5c8f;border-color:#1a5c8f}
/* 全屏提示条 */
}
#tipbar{position:fixed;left:12px;right:12px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:60;
  background:rgba(12,18,26,.94);border:1px solid rgba(124,196,255,.35);border-radius:14px;padding:12px 14px;
  color:#eaf2fa;font-size:13px;line-height:1.55;display:none;box-shadow:0 8px 26px rgba(0,0,0,.45)}
#tipbar.on{display:block}
#tipbar b{color:#7cc4ff}
#tipbar .x{float:right;margin-left:10px;color:#8aa0b4;font-size:16px;line-height:1}
body.standalone #fsBtn{display:none}   /* 已经是全屏 App 了，不用再点 */
#stage.tall{min-height:0}
/* 取景 */
#stage{position:relative;flex:1 1 auto;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:0;touch-action:none}   /* v26：自己接管手势，否则 iOS 把两指捏合当网页缩放吃掉 */
#stage video{width:100%;height:100%;object-fit:contain;display:block}
#recCanvas{display:none}
#wmCv{position:absolute;touch-action:none;z-index:5}
.zoomctl{position:absolute;right:8px;top:50%;transform:translateY(-50%);z-index:14;display:flex;flex-direction:column;gap:4px;background:rgba(12,18,26,.5);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:6px 4px}
.zoomctl .zbtn{width:42px;height:30px;line-height:30px;text-align:center;border-radius:15px;font-size:11.5px;font-weight:800;color:#dbe7f3;background:rgba(255,255,255,.08);letter-spacing:.2px;user-select:none}
.zoomctl .zbtn.on{background:#1a5c8f;color:#fff;box-shadow:0 2px 8px rgba(26,92,143,.55)}
.zoomctl .zbtn.off{opacity:.32}
.zoomctl .zbtn:active{transform:scale(.94)}

/* 取景上的小胶囊 */
.chipbar{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;z-index:15;pointer-events:none}
.chip{pointer-events:auto;display:flex;align-items:center;gap:7px;background:rgba(12,18,26,.66);border:1px solid rgba(255,255,255,.14);
  color:#eaf2fa;padding:8px 13px;border-radius:999px;font-size:13px;font-weight:600;backdrop-filter:blur(8px)}
.chip:active{background:rgba(255,255,255,.16)}
.chip b{font-weight:800;color:#7cc4ff}
/* 底部 App 操作栏 */
.bottombar{flex:0 0 auto;background:#0b0f14;border-top:1px solid rgba(255,255,255,.06);
  padding:12px 18px calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between}
.bottombar .side{width:64px;display:flex;justify-content:center}
.thumb{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
  display:flex;align-items:center;justify-content:center;color:#c7d6e4;overflow:hidden;background-size:cover;background-position:center}
.thumb.has{border-color:#3b82f6}
.bb-c{display:flex;flex-direction:column;align-items:center;gap:9px}
.modes{display:flex;background:rgba(255,255,255,.09);border-radius:999px;padding:3px}
.modes div{padding:6px 20px;border-radius:999px;font-size:13px;font-weight:700;color:#9fb0c0}
.modes div.on{background:#fff;color:#101418}
#shutter{width:80px;height:80px;border-radius:50%;background:transparent;border:4px solid #fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
#shutter .in{width:62px;height:62px;border-radius:50%;background:#fff;transition:all .15s}
#shutter:active .in{transform:scale(.92)}
#shutter.vid .in{background:#ff4d4f}                                  /* v18：录像模式 → 内圆变红 */
#shutter.rec .in{animation:recPulse 1.1s ease-in-out infinite}          /* v18：录制中 → 红圆呼吸，不再用红方块 */
@keyframes recPulse{0%,100%{transform:scale(1)}50%{transform:scale(.82)}}
#timer{display:none;position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:16;background:rgba(220,40,40,.86);
  padding:5px 14px;border-radius:999px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
#timer.rec{display:flex;align-items:center;gap:6px}
#timer i{width:9px;height:9px;border-radius:50%;background:#fff;display:block}
.hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.9);font-size:11.5px;
  background:rgba(0,0,0,.5);padding:5px 12px;border-radius:999px;z-index:6;pointer-events:none;white-space:nowrap}
/* 设置面板（底部抽屉） */
#sheet{display:none;position:absolute;left:0;right:0;bottom:0;background:#fff;color:#222;border-radius:20px 20px 0 0;
  padding:10px 14px calc(18px + env(safe-area-inset-bottom));z-index:40;box-shadow:0 -8px 30px rgba(0,0,0,.5);
  max-height:80vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
#sheet .handle{width:44px;height:4px;border-radius:99px;background:#d7dde5;margin:2px auto 10px}
#sheet .sTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
#sheet .sTop b{font-size:16px;color:#101828}
#sheet .sTop .x{font-size:13px;color:#667085;padding:6px 10px;background:#f2f4f7;border-radius:999px}
#sheet .sec{font-size:12px;color:#667085;margin:14px 0 7px;font-weight:700;display:flex;justify-content:space-between}
#sheet .sec span{color:#1d5bd8;font-weight:800}
#sheet .tabs{display:flex;gap:6px;background:#f2f4f7;border-radius:12px;padding:4px;margin:6px 0 12px}
#sheet .tabs div{flex:1;text-align:center;padding:10px 4px;border-radius:9px;font-size:14px;font-weight:700;color:#5b6b7e}
#sheet .tabs div.on{background:#fff;color:#12306e;box-shadow:0 1px 5px rgba(16,24,40,.14)}
#sheet .pane{display:none}
#sheet .pane.on{display:block}
#sheet .paneTip{font-size:11.5px;color:#98a2b3;margin-top:12px;text-align:center;line-height:1.5}
#sheet .cats{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
#sheet .cats div{flex:0 0 auto;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;background:#f2f4f7;color:#5b6b7e}
#sheet .cats div.on{background:#12306e;color:#fff}
#sheet .tplRow{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
#sheet .tplRow .t{text-align:center}
#sheet .tplRow canvas{width:100%;aspect-ratio:288/420;height:auto;border-radius:10px;border:2px solid #e4e7ec;background:#3a434b;display:block}
#sheet .tplRow .t.on canvas{border-color:#1d5bd8;box-shadow:0 0 0 3px rgba(29,91,216,.18)}
#sheet .tplRow .n{font-size:11.5px;color:#344054;margin-top:5px;line-height:1.25;font-weight:600}
#sheet .row{display:flex;gap:7px;flex-wrap:wrap}
#sheet .row div{padding:9px 13px;border:1px solid #e4e7ec;border-radius:11px;font-size:13px;color:#344054;background:#f9fafb}
#sheet .row div.on{background:#1d5bd8;color:#fff;border-color:#1d5bd8;font-weight:700}
#sheet .fld{display:flex;gap:7px;flex-wrap:wrap}
#sheet .fld div{padding:8px 12px;border-radius:999px;font-size:13px;background:#f2f4f7;color:#475467;border:1px solid #e4e7ec}
#sheet .fld div.on{background:#e8f0fe;border-color:#1d5bd8;color:#12306e;font-weight:700}
#sheet input[type=range]{width:100%;margin:4px 0 2px;accent-color:#1d5bd8;height:26px}
#sheet label{display:block;font-size:11.5px;color:#667085;margin:9px 0 4px;font-weight:600}
#sheet input[type=text]{width:100%;padding:11px 12px;border:1px solid #e4e7ec;border-radius:11px;font-size:15px;background:#f9fafb}
#sheet .btns{display:flex;gap:9px;margin-top:16px}
#sheet .btns div{flex:1;text-align:center;padding:13px;border-radius:12px;font-size:15px;font-weight:700}
/* 拍摄预览 */
#previewWrap{display:none;position:absolute;inset:0;background:#000;z-index:30;overflow:auto;padding:10px}
#previewWrap .pmedia{width:100%;border-radius:12px;background:#14181d;max-height:66vh;object-fit:contain}
#pvBar{position:fixed;left:0;right:0;bottom:0;background:#0b0f14;border-top:1px solid rgba(255,255,255,.08);
  padding:10px 12px calc(12px + env(safe-area-inset-bottom));display:flex;gap:9px;z-index:31}
#pvBar .b{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 4px;border:none;border-radius:12px;
  color:#fff;font-size:15px;font-weight:700}
.st{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:rgba(12,18,26,.92);
  color:#9ff0b6;padding:9px 16px;border-radius:999px;font-size:13px;z-index:32;display:none;text-align:center;max-width:92vw;
  border:1px solid rgba(255,255,255,.12)}
.st.err{color:#ffb4b4}
@media (orientation:landscape){
  /* v39：以 v33 为基准 —— 右侧拍照栏原样不动，只做三处：① 变焦挪到右边 ② 取景贴住右栏(不留空) ③ 水印变窄 */
  .appbar{padding:calc(2px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 2px calc(10px + env(safe-area-inset-left));gap:8px;margin-right:122px}
  .ttl{font-size:14px;line-height:1.25}
  .ttl span{font-size:10.5px}
  #stage{margin-right:122px}
  #stage video{object-fit:cover}
  .bottombar{position:fixed;right:0;top:0;bottom:0;width:122px;margin:0;
    padding:calc(8px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) 6px;
    flex-direction:column;align-items:center;justify-content:flex-end;gap:12px;
    border-top:none;border-left:1px solid rgba(255,255,255,.08)}
  .bottombar .side{width:100%;flex-direction:column;align-items:center;gap:10px}
  .bottombar>*{flex:0 0 auto}
  .bb-c{gap:12px}
  .modes{flex-direction:column;padding:2px;gap:2px}
  .modes>div{padding:6px 10px;font-size:11.5px;text-align:center;border-radius:999px}
  #shutter{width:62px;height:62px;border-width:3px;flex:0 0 auto;aspect-ratio:1/1}
  .bottombar .side .thumb{width:44px!important;height:44px!important}
  .bottombar .side button.ic{width:42px!important;height:42px!important}
  .zoomctl{position:fixed;left:auto;right:calc(122px + 6px + env(safe-area-inset-right));top:50%;transform:translateY(-50%);
    flex-direction:column;gap:3px;padding:5px 3px;border-radius:18px}
  .zoomctl .zbtn{width:38px;height:26px;line-height:26px;font-size:11px;border-radius:13px}
  .chipbar{top:calc(4px + env(safe-area-inset-top))!important}
  #tipbar{left:8px;right:auto;width:min(52%,340px);bottom:calc(10px + env(safe-area-inset-bottom));font-size:12px;padding:8px 10px}
}
</style>
</head>
<body>
<header class="appbar">
  <button class="ic" onclick="backHome()" aria-label="返回"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <div class="ttl">水印相机<span>施工记录 · 拍照留档 · <b id="verTag" style="color:#ffc53d">v42</b></span></div>
  <button class="ic" onclick="flipCam()" aria-label="翻转"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M20 12a8 8 0 0 1-13.7 5.6M4 12a8 8 0 0 1 13.7-5.6"/><path d="M17 3v4h-4M7 21v-4h4"/></svg></button>
  <button class="ic" id="fsBtn" onclick="goFull()" aria-label="全屏" title="全屏"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/></svg></button>
  <a class="exit" href="javascript:logout()">退出</a>
</header>

<div id="stage">
  <video id="vd" autoplay playsinline muted></video>
  <canvas id="recCanvas" width="1280" height="720"></canvas>
  <canvas id="wmCv"></canvas>
  <div class="zoomctl" id="zoomCtl" title="两指捏合也可缩放"><div class="zbtn off" data-z="0.5" onpointerdown="lensHoldStart()" onpointerup="lensHoldEnd()" onpointercancel="lensHoldEnd()" onpointerleave="lensHoldEnd()" onclick="pickZoom(0.5)">0.5×</div><div class="zbtn on" data-z="1" onclick="pickZoom(1)">1×</div><div class="zbtn" data-z="2" onclick="pickZoom(2)">2×</div><div class="zbtn" data-z="3" onclick="pickZoom(3)">3×</div><div class="zbtn" data-z="4" onclick="pickZoom(4)">4×</div></div>

  <div class="chipbar">
    <div class="chip" onclick="openSheet('tpl')"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/></svg><b id="chipTpl">经典工程</b></div>
  </div>

  <div class="hint" id="hint">按住水印可拖动 · 轻点水印改模板</div>
  <div id="tipbar"></div>
  <div id="camGuide">
    <div class="cg-card">
      <h4>需要相机权限</h4>
      <div class="cg-why"></div>
      <div class="cg-steps"></div>
      <div class="cg-note">点一次「允许」，本机以后打开都不再询问；建议把本页「添加到主屏幕」用。</div>
      <div class="cg-btns"><button onclick="hideCamGuide()">知道了</button><button class="p" onclick="hideCamGuide();startCam();">我已允许，重试</button></div>
    </div>
  </div>
  <div id="timer"><i></i><span id="tsec">00:00</span></div>
</div><!-- ★ 闭合 #stage：底部操作栏必须是 body 的直接子元素，否则会跟取景一起被居中 → 快门跑到屏幕中间 ★ -->

  <div id="sheet">
    <div class="handle"></div>
    <div class="sTop"><b>水印</b><span class="x" onclick="closeSheet()">收起</span></div>
    <div class="tabs">
      <div data-tab="tpl" onclick="showTab('tpl')">模板</div>
      <div data-tab="content" class="on" onclick="showTab('content')">内容</div>
      <div data-tab="style" onclick="showTab('style')">样式</div>
    </div>

    <div class="pane" id="pane-tpl">
      <div class="cats" id="catRow"></div>
      <div class="tplRow" id="tplRow"></div>
      <div class="paneTip">点一下缩略图立即换模板，画面同步变</div>
    </div>

    <div class="pane on" id="pane-content">
      <label>项目名称（必填 · 决定后端相册文件夹）</label><input type="text" id="edProject" placeholder="如：示例市政道路改造工程">
      <label>施工区域</label><input type="text" id="edArea" placeholder="如：151平台">
      <label>分项名称（选填，填了就当这一行的名，如：挡土墙）</label><input type="text" id="edPart" placeholder="如：挡土墙">
      <label>施工内容</label><input type="text" id="edContent" placeholder="如：地磅引坡浇筑">
      <label>地点（自动已填，可改）</label><input type="text" id="edPlace">
      <label>施工路线 / 整改要求（选填）</label><input type="text" id="edRoute" placeholder="如：K2+300 至 K2+800">
      <label>记录人（选填）</label><input type="text" id="edWho" placeholder="如：张三">
      <div class="sec">单位 / 责任人（选填，填一次以后自动带）</div>
      <label>建设单位</label><input type="text" id="edBuilder" placeholder="如：示例建设工程有限公司">
      <label>施工单位</label><input type="text" id="edUnit1">
      <label>监理单位</label><input type="text" id="edUnit2">
      <label>设计单位</label><input type="text" id="edDesigner">
      <label>勘察单位</label><input type="text" id="edSurveyor">
      <label>施工责任人</label><input type="text" id="edDuty1" placeholder="如：张三">
      <label>监理责任人</label><input type="text" id="edDuty2" placeholder="如：李四">
      <label>备注</label><input type="text" id="edRemark" placeholder="选填">
      <label>项目简称（底部蓝条）</label><input type="text" id="edFoot" placeholder="如：示例工程项目">
      <div class="sec">显示字段（点一下开/关）</div>
      <div class="fld" id="fldRow"></div>
      <div class="btns"><div style="background:#f2f4f7;color:#344054" onclick="closeSheet()">取消</div>
        <div style="background:#1d5bd8;color:#fff" onclick="saveSheet()">完成</div></div>
    </div>

    <div class="pane" id="pane-style">
      <div class="sec">画面比例 <span id="arVal">16:9</span></div>
      <div class="row" id="arRow"></div>
      <div class="sec">水印位置</div>
      <div class="row" id="posRow"></div>
      <div class="sec">字号大小 <span id="scaleVal">100%</span></div>
      <input type="range" id="rScale" min="60" max="200" step="5" oninput="onScale(this.value)">
      <div class="sec">背景不透明度 <span id="alphaVal">100%</span></div>
      <input type="range" id="rAlpha" min="40" max="100" step="2" oninput="onAlpha(this.value)">
      <div class="paneTip">样式即时生效 · 水印也可以直接用手指拖到任意位置</div>
      <div class="verline" id="verLine">版本 v42</div>
    </div>
  </div>

<div class="bottombar">

<script>
/* 示例信息：换成你自己的公司/项目即可（也可以在「内容」页里逐项改，会记住） */
const CFG={company:"示例建筑集团",en:"SAMPLE GROUP",project:"示例市政道路改造工程",
  unit1:"施工单位：示例建设工程有限公司",unit2:"监理单位：示例监理咨询有限公司"};
const MOCK=new URLSearchParams(location.search).has("mock");

let stream=null, mode="photo", recOn=false, recTimer=null, recSec=0, recorder=null, recChunks=[], recCanvas=document.getElementById("recCanvas"), recCtx=recCanvas.getContext("2d"), rafId=null;
let coords=null, area="", content="", place="", weatherText="定位中…", placeText="", who="", route="";
/* v11 新增可填项（都会记忆） */
let part="", builder="", designer="", surveyor="", duty1="", duty2="", remark="",
    unit1v="示例建设工程有限公司", unit2v="示例监理咨询有限公司", footTxt="示例工程项目";
let facing="environment";
let wmPos={fx:0,fy:0.5};
let pvBlob=null, pvKind="";
let started=false;

/* ==================== 水印设置（模板 / 位置 / 字号 / 字段） ==================== */
const FLDS=[["logo","品牌图片"],["project","项目名称"],["num","编号"],["area","施工区域"],["content","施工内容"],
            ["builder","建设单位"],["unit1","施工单位"],["unit2","监理单位"],["designer","设计单位"],["surveyor","勘察单位"],
            ["duty1","施工责任人"],["duty2","监理责任人"],["who","记录人"],["time","拍摄时间"],["week","星期"],
            ["weather","天气"],["place","地点"],["gps","经纬度"],["alt","海拔"],["bearing","方位角"],
            ["speed","速度"],["route","施工路线"],["remark","备注"]];
let wmOpt={tpl:"t1",scale:1,alpha:1,pos:"lm",
  fields:{logo:1,project:1,num:0,area:1,content:1,
          builder:0,unit1:1,unit2:1,designer:0,surveyor:0,duty1:0,duty2:0,who:0,
          time:1,week:1,weather:1,place:1,gps:0,alt:0,bearing:0,speed:0,route:0,remark:0}};
const POSES=[["tl","左上"],["lm","左中"],["bl","左下"],["tr","右上"],["rm","右中"],["br","右下"]];

const LS_PREF="wc_pref_v1", LS_KEY="wc_last_input_v1";
function loadPref(){ try{ const p=JSON.parse(localStorage.getItem(LS_PREF)||"{}");
  if(p.camAR&&ARS.some(x=>x[0]===p.camAR))camAR=p.camAR;   /* 记住画面比例 */
  if(p.project)CFG.project=p.project;   /* v40：项目名称也记住 */
  if(p.tpl)wmOpt.tpl=p.tpl; if(p.scale)wmOpt.scale=p.scale; if(p.alpha)wmOpt.alpha=p.alpha; if(p.pos)wmOpt.pos=p.pos;
  /* v17 一次性把"会让水印发灰/构图不合意"的老偏好刷成本次默认（之后他自己的调整照常保留） */
  try{ if(localStorage.getItem("wc_arver")!=="17"){ camAR="16:9"; localStorage.setItem("wc_arver","17"); } }catch(_){}
  try{ if(localStorage.getItem("wc_alphaver")!=="20"){ wmOpt.alpha=1; localStorage.setItem("wc_alphaver","20");
    /* v20：直接改写存档里的 alpha（不依赖 savePref，此刻它读的值还没装载完）＋ 启动后再落一次盘 */
    try{ const _pp=JSON.parse(localStorage.getItem(LS_PREF)||"{}"); _pp.alpha=1; localStorage.setItem(LS_PREF,JSON.stringify(_pp)); }catch(_e){}
    setTimeout(function(){ try{ savePref(); }catch(_e){} }, 900);
  } }catch(_){}
  if(p.fields)Object.assign(wmOpt.fields,p.fields);
  if(typeof p.area==="string")area=p.area; if(typeof p.content==="string")content=p.content;
  if(typeof p.who==="string")who=p.who; if(typeof p.route==="string")route=p.route;
  ["part","builder","designer","surveyor","duty1","duty2","remark","unit1v","unit2v","footTxt"].forEach(k=>{
    if(typeof p[k]==="string" && p[k] !== "") eval(k + "=p[k]");
  });
}catch(e){} }
/* ---------- v41：设置云端同步（换入口不清空） ---------- */
let _prefsSynced=false, _prefPushT=null;
function _prefBody(){ try{ return JSON.parse(localStorage.getItem(LS_PREF)||"{}"); }catch(e){ return {}; } }
function pushPrefs(force){
  if(!_prefsSynced && !force) return;              /* 还没跟服务器对齐前不推，免得把空设置盖上去 */
  clearTimeout(_prefPushT);
  _prefPushT=setTimeout(()=>{ try{
    fetch("/api/prefs",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(_prefBody())}).catch(()=>{});
  }catch(e){} }, 900);
}
function syncPrefsFromServer(){
  fetch("/api/prefs",{cache:"no-store"}).then(r=>r.json()).then(j=>{
    const srv=(j&&j.prefs)||{};
    const loc=_prefBody();
    const st=Number(srv.ts||0), lt=Number(loc.ts||0);
    const has = Object.keys(srv).filter(k=>k!=="ts").length>0;
    _prefsSynced=true;
    if(has && st>=lt){                              /* 服务器更新 → 拉到本地并生效 */
      try{ localStorage.setItem(LS_PREF, JSON.stringify(Object.assign({},loc,srv))); }catch(e){}
      try{ loadPref(); }catch(e){}
      try{ const e=document.getElementById("edProject"); if(e) e.value=CFG.project; }catch(e){}
      try{ paintPreview(); }catch(e){}
    }else{
      pushPrefs(true);                              /* 本地更新 → 推上去，另一个入口就能看到 */
    }
  }).catch(()=>{ _prefsSynced=true; });
}
function savePref(){ try{ localStorage.setItem(LS_PREF,JSON.stringify({camAR:camAR,tpl:wmOpt.tpl,scale:wmOpt.scale,alpha:wmOpt.alpha,
  pos:wmOpt.pos,fields:wmOpt.fields,project:CFG.project,area:area,content:content,who:who,route:route,
  part:part,builder:builder,designer:designer,surveyor:surveyor,duty1:duty1,duty2:duty2,remark:remark,
  unit1v:unit1v,unit2v:unit2v,footTxt:footTxt,ts:Date.now()})); }catch(e){}
  try{ pushPrefs(); }catch(e){} }
function loadLastInput(){ try{ const s=JSON.parse(localStorage.getItem(LS_KEY)||"{}");
  if(!area&&typeof s.area==="string")area=s.area;
  if(!content&&typeof s.content==="string")content=s.content;
}catch(e){} }
function saveLastInput(){ savePref(); }
loadPref(); loadLastInput();

/* ---------- 自动数据 ---------- */
function nowStr(){const d=new Date(),p=n=>(n<10?"0":"")+n;return d.getFullYear()+"."+p(d.getMonth()+1)+"."+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());}
function P(v){return Math.max(1,Math.round(v));}
function fitText(ctx,t,f,max){ctx.font=f;let s=String(t==null?"":t);while(s.length>0&&ctx.measureText(s).width>max)s=s.slice(0,-1);return s+(s.length<String(t).length?"…":"");}
function drawLabSpread(ctx, s, x, width, y, color){
  /* v22：标签在 [x, x+width) 内均匀铺开 —— 短标题字间自动补空，冒号因此与四字标题对齐 */
  ctx.fillStyle=color; ctx.textAlign="left";
  const chars=[...s], n=chars.length;
  const ws=chars.map(ch=>ctx.measureText(ch).width);
  const total=ws.reduce((a,b)=>a+b,0);
  const gap = n>1 ? Math.max(0,(width-total)/(n-1)) : 0;
  let cx=x;
  for(let k=0;k<n;k++){ ctx.fillText(chars[k], cx, y); cx += ws[k] + gap; }
}
function wrapLines(ctx,t,f,max,n){ctx.font=f;const out=[];let c="";for(const ch of String(t)){if(ctx.measureText(c+ch).width>max&&c){out.push(c);c=ch;}else c+=ch;if(out.length===n){out[n-1]=out[n-1].slice(0,-1)+"…";break;}}if(c&&out.length<n)out.push(c);return out.length?out:[""];}
function rr(ctx,x,y,w,h,r){r=Math.min(r,Math.max(1,h/2),Math.max(1,w/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* ---------- 水印数据（字段库） ---------- */
function weekCN(){ return "星期" + "日一二三四五六"[new Date().getDay()]; }
function wmData(){
  const c = coords || {};
  return {
    company: CFG.company, project: CFG.project, num: NO(), week: weekCN(),
    time: nowStr(), area: area || "—", content: content || "—", route: route || "",
    weather: weatherText, place: (place || placeText || "—"),
    gps: (c.lat ? (c.lat + ", " + c.lng) : ""),
    alt: (c.alt != null ? Math.round(c.alt) + "m" : ""),
    speed: (c.spd != null ? Math.round(c.spd * 3.6) + "km/h" : ""),
    unit1: "施工单位：" + unit1v, unit2: "监理单位：" + unit2v,
    u1: unit1v, u2: unit2v,
    builder: builder, designer: designer, surveyor: surveyor,
    duty1: duty1, duty2: duty2, remark: remark,
    part: part, foot: footTxt, bearing: (c.hd != null ? Math.round(c.hd) + "°" : ""),
    who: who || ""
  };
}
/* LOGO：把图片放到服务端 app/icons/ 下、文件名写进 ICON_PATH 即可；没有图时用矢量画法兜底 */
const LOGO = new Image();
let logoReady = false;
LOGO.onload = () => { logoReady = true; try{ paintPreview(); }catch(e){} };
LOGO.onerror = () => { logoReady = false; };
LOGO.src = "/icons/guoding-logo.png";

let noSeq = null;
function NO(){ if(!noSeq){ const dt=new Date();
  noSeq=String(dt.getMonth()+1).padStart(2,"0")+String(dt.getDate()).padStart(2,"0")+"-"+String(Math.floor(Math.random()*900+100)); }
  return noSeq; }

/* ---------- 字段分组取数（模板共用，改字段只改这里） ---------- */
function fldRows(o,d){                       // "标签：值" 行
  const r=[];
  if(o.fields.area) r.push(["施工区域", d.area]);
  if(o.fields.content) r.push([d.part || "施工内容", d.content]);
  if(o.fields.route && d.route) r.push(["施工路线", d.route]);
  if(o.fields.remark && d.remark) r.push(["备注", d.remark]);
  return r;
}
function fldMeta(o,d){                       // 时间 · 星期 · 天气
  const a=[];
  if(o.fields.time) a.push(d.time);
  if(o.fields.week) a.push(d.week);
  if(o.fields.weather) a.push(d.weather);
  return a;
}
function fldLoc(o,d){                        // 地点 · 经纬度 · 海拔 · 速度
  const a=[];
  if(o.fields.place) a.push(d.place);
  if(o.fields.gps && d.gps) a.push(d.gps);
  if(o.fields.alt && d.alt) a.push("海拔 " + d.alt);
  if(o.fields.bearing && d.bearing) a.push("方位角 " + d.bearing);
  if(o.fields.speed && d.speed) a.push(d.speed);
  return a;
}
function fldUnits(o,d){                      // 单位 · 责任人 · 记录人
  const a=[];
  if(o.fields.builder && d.builder) a.push("建设单位：" + d.builder);
  if(o.fields.unit2) a.push(d.unit2);
  if(o.fields.unit1) a.push(d.unit1);
  if(o.fields.designer && d.designer) a.push("设计单位：" + d.designer);
  if(o.fields.surveyor && d.surveyor) a.push("勘察单位：" + d.surveyor);
  if(o.fields.duty1 && d.duty1) a.push("施工责任人：" + d.duty1);
  if(o.fields.duty2 && d.duty2) a.push("监理责任人：" + d.duty2);
  if(o.fields.who && d.who) a.push("记录人：" + d.who);
  return a;
}
function fldTitle(o,d,base){                 // 标题（可带编号）
  return (o.fields.num ? d.num + " · " : "") + d.company + " · " + (base || "施工记录");
}
function fldTable(o,d){                      // 表格模板逐行（按字段开关生成）
  const r=[];
  if(o.fields.area) r.push(["施工区域", d.area]);
  if(o.fields.content) r.push(["施工内容", d.content]);
  if(o.fields.route && d.route) r.push(["施工路线", d.route]);
  if(o.fields.time) r.push(["拍摄时间", d.time + (o.fields.week ? " " + d.week : "")]);
  if(o.fields.weather) r.push(["天气", d.weather]);
  if(o.fields.place) r.push(["拍摄地点", d.place]);
  if(o.fields.gps && d.gps) r.push(["经纬度", d.gps]);
  if(o.fields.alt && d.alt) r.push(["海拔", d.alt]);
  if(o.fields.speed && d.speed) r.push(["速度", d.speed]);
  if(o.fields.num) r.push(["编号", d.num]);
  if(o.fields.builder && d.builder) r.push(["建设单位", d.builder]);
  if(o.fields.designer && d.designer) r.push(["设计单位", d.designer]);
  if(o.fields.surveyor && d.surveyor) r.push(["勘察单位", d.surveyor]);
  if(o.fields.duty1 && d.duty1) r.push(["施工责任人", d.duty1]);
  if(o.fields.duty2 && d.duty2) r.push(["监理责任人", d.duty2]);
  if(o.fields.bearing && d.bearing) r.push(["方位角", d.bearing]);
  if(o.fields.remark && d.remark) r.push(["备注", d.remark]);
  if(o.fields.project) r.push(["项目名称", d.project]);
  if(o.fields.unit2) r.push(["监理单位", d.unit2.replace(/^监理单位：/,"")]);
  if(o.fields.unit1) r.push(["施工单位", d.unit1.replace(/^施工单位：/,"")]);
  return r;
}

/* ==================== 9 种水印模板（画布绘制，唯一实现：预览/拍照/录像共用） ==================== */
const CATS=[["all","全部"],["gc","工程"],["xj","巡检 · 验收"],["dk","打卡 · 考勤"],["jj","极简"]];
const TPL=[
{id:"t1",cat:"gc",name:"经典工程",note:"科技蓝",draw(ctx,W,H,fx,fy,d,o){
  /* 标准工程水印牌：科技蓝 #1a5c8f 系 + 真 LOGO + 标签右对齐 + 下部蓝底单位行 + 底部团队专属 */
  const ux = v => v*(W/1000)*1.55*o.scale;                          // 横向基准
  const kY = Math.max(0.95, Math.min(1.42, (H/Math.max(1,W))/1.32)); // 结合画面长宽比：竖构图(3:4≈1.33)=1.0，越竖越高
  const uy = v => ux(v)*kY;
  const BLUE="#1a5c8f", BLUE2="#2a6fa3", BLUE3="#123f63", DK="#1b2229", GY="#39434d", W1="#ffffff", YL="#ffc53d";
  const pad = ux(16);
  /* 内容行 */
  const rows=[];
  if(o.fields.area) rows.push(["施工区域", d.area]);
  if(o.fields.content) rows.push([d.part||"施工内容", d.content]);
  if(o.fields.route && d.route) rows.push(["施工路线", d.route]);
  if(o.fields.time) rows.push(["拍摄时间", d.time + (o.fields.week ? " " + d.week : "")]);
  if(o.fields.weather) rows.push(["天气", d.weather]);
  if(o.fields.place) rows.push(["地点", d.place]);
  if(o.fields.alt && d.alt) rows.push(["海拔", d.alt]);
  if(o.fields.bearing && d.bearing) rows.push(["方位角", d.bearing]);
  if(o.fields.speed && d.speed) rows.push(["速度", d.speed]);
  if(o.fields.gps && d.gps) rows.push(["经纬度", d.gps]);
  if(o.fields.remark && d.remark) rows.push(["备注", d.remark]);
  /* 单位/责任人行 */
  const units=[];
  if(o.fields.builder && d.builder) units.push(["建设单位", d.builder]);
  if(o.fields.unit2) units.push(["监理单位", d.u2]);
  if(o.fields.unit1) units.push(["施工单位", d.u1]);
  if(o.fields.designer && d.designer) units.push(["设计单位", d.designer]);
  if(o.fields.surveyor && d.surveyor) units.push(["勘察单位", d.surveyor]);
  if(o.fields.duty1 && d.duty1) units.push(["施工责任人", d.duty1]);
  if(o.fields.duty2 && d.duty2) units.push(["监理责任人", d.duty2]);
  if(o.fields.who && d.who) units.push(["记录人", d.who]);
  /* 字号 */
  const fT="bold "+P(ux(18))+"px sans-serif", fL="bold "+P(ux(16))+"px sans-serif", fV=P(ux(16))+"px sans-serif",
        fU="bold "+P(ux(15))+"px sans-serif", fM="bold "+P(ux(14))+"px sans-serif";
  /* v44：卡片宽度定死（画面宽 50%，取整为整数像素；保留 ux(580) 上限）
     —— 不再随内容浮动；内容超宽由下面的自动换行处理 */
  const unitLab = ux(78);
  const cw = Math.round(Math.min(W*0.50*WM_WF, ux(580)));
  /* 表头高度（项目名折行） */
  const logoTxt = ux(86);
  const headH = Math.max(uy(70), 1);   // 先占位，下面按折行数算
  const titleMax = cw - (o.fields.logo ? logoTxt + ux(26) : pad*2) - pad;
  const tLines = wrapLines(ctx, d.project || d.company, fT, titleMax, 3);
  const headH2 = Math.max(uy(72), tLines.length*uy(26)+uy(28));
  /* 字段区：标签列宽 → 冒号对齐 */
  const rowH = uy(31);
  let labMax=0; ctx.font=fL;
  for(const [k] of rows) labMax=Math.max(labMax, ctx.measureText(k+"：").width);
  /* v44：字段值超宽自动换行（原来用 fitText 会逐字砍尾巴丢字）—— 预量折行数，高度与绘制共用 */
  const rLines=[]; let rowsBlock=0;
  ctx.font=fV;
  for(const [k,v] of rows){
    const ls=wrapLines(ctx, (v==null?"":String(v)), fV, Math.max(ux(60), cw-pad*2-labMax), 6);
    rLines.push([k, ls]); rowsBlock += Math.max(1, ls.length)*rowH;
  }
  /* 单位区：值可折行 */
  const uLines=[];
  let unitBlock=0;
  ctx.font=fU;
  for(const [k,v] of units){
    const ls=wrapLines(ctx, v, fU, cw-pad*2-unitLab, 2);
    uLines.push([k, ls]); unitBlock += ls.length*uy(23)+uy(8);
  }

/* 预览层与视频画面严格对齐（object-fit:contain 的显示矩形） */
let wmVw=0, wmVh=0, wmDirty=true, wmLastMin="", frameAR=0, hiresTries=0;   /* v42：重开流的次数上限 */   /* v37：frameAR=取景点宽高比（出图按它中心裁切） */
function fitWmCv(){
  const vd=document.getElementById("vd"), cv=document.getElementById("wmCv"), st=document.getElementById("stage");
  const r=st.getBoundingClientRect();
  /* ★ v30：视频还没到就用"目标比例"，别用 16×9 的临时值，否则视频一到画布要重设 → 就是那一下跳 */
  const _aw=arWH(camAR,1080);
  const vw=vd.videoWidth||(MOCKIMG?MOCKIMG.width:_aw.w), vh=vd.videoHeight||(MOCKIMG?MOCKIMG.height:_aw.h);
  /* v37：横屏视频是 cover 填满，画布就取整个取景区（水印坐标=可见范围，所见即所得） */
  const _lsCv = !!(window.matchMedia && matchMedia("(orientation:landscape)").matches);
  const sc = _lsCv ? Math.max(r.width/vw, r.height/vh) : Math.min(r.width/vw, r.height/vh);
  let w = _lsCv ? Math.round(r.width) : Math.round(vw*sc), h = _lsCv ? Math.round(r.height) : Math.round(vh*sc);
  frameAR = w/Math.max(1,h);
  const dpr=Math.min(3, window.devicePixelRatio||1);   /* ★ v14：原来封顶2倍，3x屏（iPhone）上会被放大1.5倍→水印发虚 */
  const pw=Math.round(w*dpr), ph=Math.round(h*dpr);
  /* ★ v29：取景区"小幅变化"（iOS 首次触摸收起工具栏、地址栏伸缩等）不重设画布 ——
     否则水印会跳一下、旧帧还会残留一瞬（用户看到的就是"底下压着另一层水印"）。
     同时：拖动水印过程中绝不重设画布。 */
  const ow=Number(cv.dataset.lw)||0, oh=Number(cv.dataset.lh)||0;
  const cssSame = ow>0 && oh>0 && Math.abs(w-ow)/ow<0.03 && Math.abs(h-oh)/oh<0.03
                  && Math.abs((w/h)-(ow/oh))/(ow/oh)<0.015;
  const backingBad = (pw!==wmVw) || (ph!==wmVh);   /* v41：位图密度不对（换入口/dpr 变化/首次）→ 必须补，否则被浏览器放大 = 发虚 */
  if(wmDragging) return false;                      /* 拖动水印时不动画布 */
  if(cssSame && !backingBad) return false;          /* 真的没变化 → 什么都不做（不闪） */
  if(!cssSame){                                     /* 只有 CSS 尺寸真变了才挪位置/改大小（会跳屏的那种） */
    cv.style.left=(_lsCv?0:Math.round((r.width-w)/2))+"px"; cv.style.top=(_lsCv?0:Math.round((r.height-h)/2))+"px";
    cv.style.width=w+"px"; cv.style.height=h+"px";
  }
  cv.width=pw; cv.height=ph; cv.dataset.lw=w; cv.dataset.lh=h;
  wmVw=pw; wmVh=ph; return {w,h};
}
let wmOptUse=null, WM_WF=1, wmFitK=1;   /* v34：WM_WF=宽度上限系数，wmFitK=当前整体缩放（拍照/录像跟随预览） */          /* v32：预览/拍照/录像统一使用的（按画面适配过的）水印参数 */
function drawWmAny(ctx,W,H){        /* v34：预览/拍照/录像统一入口（带同一套适配系数） */

function paintPreview(){
  const cv=document.getElementById("wmCv"); if(!cv.width) return;
  const ctx=cv.getContext("2d");
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality="high";   /* ★ v14：LOGO 图片缩放更细腻 */
  ctx.clearRect(0,0,cv.width,cv.height);                 // 清+画在同一帧完成，画面不会空一拍
  try{
    /* v32：卡片放不下就按比例缩（只缩不放）—— 横屏/扁画面时不会超出取景框；预览与出图用同一份参数 */
    let o = wmOpt;
    drawWm(ctx,cv.width,cv.height,wmData(),o);
    /* v36：水印宽度横竖屏"同一套比例" —— 一律按画面短边取 60%
       竖屏短边=宽 → 与原来完全一致；横屏短边=高 → 卡片整体等比缩，形状跟竖屏一模一样，只是没那么宽 */
    const isLs = !!(window.matchMedia && matchMedia("(orientation:landscape)").matches);
    const capW = (isLs && cv.width > cv.height) ? (0.60*cv.height/cv.width) : 0.62;
    let k = 1;
    WM_WF = 1;
    for(let i=0;i<3 && wmBox;i++){
      const kH = wmBox.h > cv.height*0.78 ? (cv.height*0.74)/wmBox.h : 1;
      const kW = wmBox.w > cv.width*capW   ? (cv.width*capW)/wmBox.w     : 1;
      const kk = Math.min(kH,kW);
      if(kk >= 0.995) break;
      k = Math.max(0.3, k*kk);   /* v37: lower the floor so landscape can reach 60% of short side */
      ctx.clearRect(0,0,cv.width,cv.height);
      WM_WF = k;
      drawWm(ctx,cv.width,cv.height,wmData(),Object.assign({},o,{scale:wmOpt.scale*k}));
    }
    wmFitK = k; WM_WF = 1;
    wmOptUse = Object.assign({}, wmOpt, {scale: wmOpt.scale*k});
  }catch(e){ console.error("wm draw error:",e); }
  wmDirty=false; wmLastMin=nowStr();
  const chip=document.getElementById("chipTpl"); if(chip) chip.textContent=tplById(wmOpt.tpl).name;
}

/* v23：两指捏合调焦距（单指不受影响，拖水印/点屏照旧） */
(function(){
  const st=document.getElementById("stage"); if(!st) return;
  let d0=0, z0=1, act=false;
  const dist=t=>{ const a=t[0], b=t[1]; return Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY)||1; };
  st.addEventListener("touchstart", e=>{ if(e.touches.length===2){ act=true; d0=dist(e.touches); z0=camZoom; } }, {passive:true});
  st.addEventListener("touchmove", e=>{
    if(e.touches.length!==2) return;
    if(!act){ act=true; d0=dist(e.touches); z0=camZoom; }      /* v27：两指不必严格同时落下，落下即接管 */
    e.preventDefault();
    const r=dist(e.touches)/Math.max(1,d0);
    if(Math.abs(r-1)>0.02) setZoom(z0*r);                       /* 动一点点就跟随 */
  }, {passive:false});
  st.addEventListener("touchend", e=>{ if(e.touches.length<2) act=false; }, {passive:true});
  st.addEventListener("touchcancel", ()=>{ act=false; }, {passive:true});
  /* v26：Safari 的专有手势事件（两指捏合会走这里，不处理就被它当成网页缩放） */
  st.addEventListener("gesturestart", e=>{ e.preventDefault(); act=true; d0=0; z0=camZoom; }, {passive:false});
  st.addEventListener("gesturechange", e=>{
    e.preventDefault();
    if(!act) { act=true; z0=camZoom; }
    if(e.scale>0) setZoom(z0*e.scale);
  }, {passive:false});
  st.addEventListener("gestureend", e=>{ e.preventDefault(); act=false; }, {passive:false});
  document.addEventListener("gesturestart", e=>{ if(e.target.closest && e.target.closest("#stage")) e.preventDefault(); }, {passive:false});
})();

/* ---------- 水印拖动 ---------- */
function bindWm(){
  const cv=document.getElementById("wmCv");
  if(cv.__bound) return; cv.__bound=true;          // 只绑一次（相机启动/开机各调一次也不重复）
  let sx=0, sy=0, moved=false, box0=null;
  const pxScale=()=>cv.width/Math.max(1,Number(cv.dataset.lw)||cv.width);   // CSS 像素 → 画布像素
  /* ★ v13：监听只绑一次；pointercancel 兜底；占位框坏了先自愈再判定（避免"再点水印没反应"） */
  let wmActive=false, wmMoved=false, wmSX=0, wmSY=0, wmB0=null;
  function boxOK(b){ return !!b && isFinite(b.x)&&isFinite(b.y)&&isFinite(b.w)&&isFinite(b.h) && b.w>2 && b.h>2; }
  function ensureWmBox(cv){
    if(!boxOK(wmBox) || wmBox.W!==cv.width || wmBox.H!==cv.height){ try{ paintPreview(); }catch(_){} }
    return boxOK(wmBox);
  }
  cv.addEventListener("pointerdown", e=>{
    if(!ensureWmBox(cv)) return;
    const r=cv.getBoundingClientRect(), s=pxScale();
    const px=(e.clientX-r.left)*s, py=(e.clientY-r.top)*s, m=22*s;      // 22 设备像素容差，手指好点
    if(px<wmBox.x-m||px>wmBox.x+wmBox.w+m||py<wmBox.y-m||py>wmBox.y+wmBox.h+m) return;  // 没点到水印：不响应
    e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(_){}
    wmActive=true; wmMoved=false; wmSX=e.clientX; wmSY=e.clientY; wmDragging=true;
    wmB0={x:wmBox.x, y:wmBox.y, w:wmBox.w, h:wmBox.h};
  }, {passive:false});
  cv.addEventListener("pointermove", e=>{
    if(!wmActive) return;
    const dx=e.clientX-wmSX, dy=e.clientY-wmSY;
    if(!wmMoved && (Math.abs(dx)>6||Math.abs(dy)>6)) wmMoved=true;
    if(!wmMoved) return;
    const s2=pxScale();
    wmPos.fx=Math.max(0,Math.min(1, (wmB0.x+dx*s2)/Math.max(1,cv.width-wmB0.w)));
    wmPos.fy=Math.max(0,Math.min(1, (wmB0.y+dy*s2)/Math.max(1,cv.height-wmB0.h)));
    wmOpt.pos="free"; paintPreview();
    if(e.cancelable) e.preventDefault();
  }, {passive:false});
  function wmEnd(e, cancelled){
    if(!wmActive) return;                       // 没有进行中的手势 → 直接忽略（不会污染状态）
    const movedNow=wmMoved; wmActive=false; wmMoved=false; wmDragging=false;
    try{ cv.releasePointerCapture(e.pointerId); }catch(_){}
    if(movedNow){ try{ savePref(); }catch(_){} }
    else if(!cancelled){ openSheet("content"); } // 轻点=打开设置；被系统取消就当没发生
  }
  cv.addEventListener("pointerup", e=>wmEnd(e,false));
  cv.addEventListener("pointercancel", e=>wmEnd(e,true));        /* ★ iOS 手势被接管时不会给 pointerup */
  window.addEventListener("blur", ()=>{ wmActive=false; wmMoved=false; });
  document.addEventListener("visibilitychange", ()=>{ if(document.hidden){ wmActive=false; wmMoved=false; } });
}

/* ---------- 坐标（定位/天气） ---------- */
function getLoc(){return new Promise((ok,fail)=>{
  if(!navigator.geolocation){fail("浏览器不支持定位");return;}
  let best=null, tries=0;
  const attempt=()=>{ tries++;
    navigator.geolocation.getCurrentPosition(p=>{
      const acc=p.coords.accuracy||9999;
      if(!best||acc<best.acc) best={latitude:p.coords.latitude, longitude:p.coords.longitude, acc:acc,
        alt:(p.coords.altitude!=null?p.coords.altitude:null), spd:(p.coords.speed!=null?p.coords.speed:null)};
      if(tries>=3){ best?ok(best):fail("定位失败"); } else setTimeout(attempt,600);
    }, ()=>{ if(tries>=3){ best?ok(best):fail("定位失败(已重试3次)"); } else setTimeout(attempt,600); },
    {enableHighAccuracy:true,timeout:10000,maximumAge:0});
  };
  attempt();
});}
async function fetchAll(){
  try{
    const c=await getLoc();
    coords={lat:c.latitude.toFixed(6),lng:c.longitude.toFixed(6),alt:(c.alt!=null?c.alt:null),spd:(c.spd!=null?c.spd:null),hd:(c.hd!=null?c.hd:null)};
    const [w,g]=await Promise.all([fetch("/api/weather?lat="+coords.lat+"&lng="+coords.lng).then(r=>r.json()),fetch("/api/regeo?lat="+coords.lat+"&lng="+coords.lng).then(r=>r.json())]);
    if(w.ok) weatherText=(w.text+" "+w.temp+"°C "+w.wind).trim();
    if(g.ok&&g.label){place=g.label;placeText=g.label;} else {place=placeText=coords.lat+","+coords.lng;}
  }catch(e){
    coords=null;
    try{const w=await fetch("/api/weather").then(r=>r.json());if(w.ok) weatherText=(w.text+" "+w.temp+"°C "+w.wind).trim();}catch(e2){}
    place=placeText="未获取到定位";
  }
  paintPreview();
}

async function findUltraWide(){

  try{

    if(camList.length===0) camList = ds.slice();

    /* 优先：标签明确写 ultra/超广角；其次：用户上次手动选的镜头 */
    let uw = ds.find(d=>!isFront(d) && /(ultra|超广角)/i.test(d.label||""));

async function pickZoom(z){
  try{
    if(z===0.5){
      if(!ultraDevId){ openLensPicker(); return; }        /* v31：让用户手动选一次，不再"点了没反应" */
      if(!ultraOn){
        const backDev = camDevId || lastGoodDevId;
        if(!mainDevId) mainDevId = backDev;
        camDevId = ultraDevId;
        if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
        ultraOn = true; startCam();
        setZoom(1); syncZoomUI();
        /* v28：1 秒内校验，若变成自拍/没开起来 → 回主摄 + 置灰 0.5× */
        setTimeout(()=>{
          try{
            const tk = stream && stream.getVideoTracks ? stream.getVideoTracks()[0] : null;
            const s = tk && tk.getSettings ? tk.getSettings() : {};
            const bad = !tk || tk.readyState!=="live" || s.facingMode==="user";
            if(bad){
              camDevId = backDev; ultraOn=false; ultraDevId="";
              try{ localStorage.removeItem("wc_uw_dev"); }catch(_){} uwPicked="";
              if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
              startCam(); syncZoomUI();
              flash("这台手机没找到超广角镜头，已回到主摄（" + camListTxt() + "）", true);
            }
          }catch(e){}
        }, 1100);
      } else { setZoom(1); syncZoomUI(); }
      return;
    }
    if(ultraOn){ camDevId=mainDevId||camDevId; ultraOn=false;
      if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } startCam(); }
    /* v31：点 1× 必须是"后置主摄" —— 如果之前镜头状态乱了（停在别的不认识的镜头上）就复位 */
    else {
      const tk = stream && stream.getVideoTracks ? stream.getVideoTracks()[0] : null;
      const s = tk && tk.getSettings ? tk.getSettings() : {};
      const cur = (camList.find(d=>d.deviceId===camDevId)||{}).label || "";
      if(s.facingMode==="user" || /front|user|前置|自拍/i.test(cur)){
        camDevId=""; facing="environment";
        try{ localStorage.removeItem("wc_cam_dev"); }catch(e){}
        if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
        startCam(); flash("已切回后置主摄");
      }
    }
    setZoom(z);
  }catch(e){}
}
function srcRect(W,H){                                /* 拍照/录像共用的裁剪框（数码变焦=裁剪放大）；W/H 可显式传入便于自测 */
  const vd=document.getElementById("vd");
  W = W || (vd?vd.videoWidth:0); H = H || (vd?vd.videoHeight:0);
  const z=Math.max(1,camZoom);
  let sw=W/z, sh=H/z, sx=(W-sw)/2, sy=(H-sh)/2;
  /* v38：撤回"按取景点比例裁照片"——照片保持相机原比例，不做宽带裁切 */
  return {sx:sx, sy:sy, sw:sw, sh:sh};
}
async function ensureHiRes(tag){
  /* 关键：二次进入时浏览器常给回 640x480 之类的低分辨率流 → 画面发虚。这里主动要求回目标分辨率 */
  try{
    const tk = stream && stream.getVideoTracks ? stream.getVideoTracks()[0] : null;
    if(!tk) return;
    const want = arWH(camAR, 1080);
    const s = (tk.getSettings && tk.getSettings()) || {};
    if((s.width||0) >= want.w*0.85 && (s.height||0) >= want.h*0.85) return;   // 已经够高，不动
    try{ await tk.applyConstraints({width:{ideal:want.w},height:{ideal:want.h},aspectRatio:want.w/want.h}); }catch(e){}
    const s2 = (tk.getSettings && tk.getSettings()) || {};
    if((s2.width||0) >= want.w*0.7 && (s2.height||0) >= want.h*0.7) return;   /* 提上来了 */
    if(hiresTries>=1) return;                                                /* 只重开一次，防死循环 */
    hiresTries++;
    /* v42：约束被忽略 → 重开一路流（同一页面内重开，权限已授权，不会再弹窗；比例不变，所以画面不会跳） */
    try{
      const vwant = {width:{ideal:want.w}, height:{ideal:want.h}, aspectRatio:want.w/want.h, facingMode:(facing||"environment")};
      if(camDevId) vwant.deviceId = {exact:camDevId};
      const ns = await navigator.mediaDevices.getUserMedia({video:vwant, audio:false});
      const ntk = ns.getVideoTracks()[0];
      const ns2 = (ntk && ntk.getSettings) ? ntk.getSettings() : {};
      if(stream) stream.getTracks().forEach(t=>t.stop());
      stream = ns; camDevId = ns2.deviceId || camDevId;
      const vd=document.getElementById("vd"); vd.srcObject=stream; await vd.play().catch(()=>{});
      started=true; fitWmCv(); paintPreview();
    }catch(e){}
    return;
  }catch(e){}
}

/* 相机权限管理：一开直接复用活着的流；换镜头只换 deviceId；失败按错误类型给指引 */
async function startCam(){
  const vd=document.getElementById("vd");

  }catch(e){

    }else if(n==="NotFoundError" || n==="OverconstrainedError"){

    }else if(n==="InsecureContext" || !window.isSecureContext){
      flash("请用 https://syxj.vip.cpolar.cn 打开（http 或内网 IP 浏览器不给相机权限）",true);

const JPEG_Q=0.80, MAX_SIDE=2048;   /* v15：长边 1600→2048、质量 0.72→0.80，照片更清晰（单张约 400~600KB） */
function doPhoto(){
  const vd=document.getElementById("vd");
  if((!vd||!vd.videoWidth)&&MOCKIMG){
    const c=document.createElement("canvas"); c.width=MOCKIMG.width; c.height=MOCKIMG.height;
    const x=c.getContext("2d"); const z=Math.max(1,camZoom);
    const sw=MOCKIMG.width/z, sh=MOCKIMG.height/z;
    x.drawImage(MOCKIMG,(MOCKIMG.width-sw)/2,(MOCKIMG.height-sh)/2,sw,sh,0,0,c.width,c.height);
    drawWmAny(x,c.width,c.height);
    pvKind="photo"; pvBlob=null;
    c.toBlob(b=>{ showPv('<img class="pmedia" src="'+URL.createObjectURL(b)+'">', b); }, "image/jpeg", JPEG_Q);
    return;
  }
  if(!vd||!vd.videoWidth){flash("相机未就绪",true);return;}
  const W=vd.videoWidth,H=vd.videoHeight;
  const R=srcRect();
  const r=Math.min(1, MAX_SIDE/Math.max(R.sw,R.sh));    /* v37：按裁切范围算，不拉伸 */
  const w=Math.max(1,Math.round(R.sw*r)), h=Math.max(1,Math.round(R.sh*r));
  const c=document.createElement("canvas");c.width=w;c.height=h;
  const ctx=c.getContext("2d");
  ctx.drawImage(vd,R.sx,R.sy,R.sw,R.sh,0,0,w,h);      /* v23：按当前焦距裁剪 */
  drawWmAny(ctx,w,h);
  pvKind="photo"; pvBlob=null;
  c.toBlob(b=>{ showPv('<img class="pmedia" src="'+URL.createObjectURL(b)+'">', b); }, "image/jpeg", JPEG_Q);
}
function natShot(inp){
  /* v26：系统相机拍回来的原图 → 按长边压到 MAX_SIDE → 套同一套水印 → 走原来的预览/保存流程 */
  const f = inp.files && inp.files[0]; if(!f){ return; }
  const rd = new FileReader();
  rd.onload = ()=>{
    const im = new Image();
    im.onload = ()=>{
      const r = Math.min(1, MAX_SIDE/Math.max(im.width, im.height));
      const w = Math.max(1, Math.round(im.width*r)), hh = Math.max(1, Math.round(im.height*r));
      const c = document.createElement("canvas"); c.width=w; c.height=hh;
      const x = c.getContext("2d"); x.drawImage(im, 0, 0, w, hh);
      drawWmAny(x, w, hh);
      pvKind="photo"; pvBlob=null;
      c.toBlob(b=>{ showPv('<img class="pmedia" src="'+URL.createObjectURL(b)+'">', b); }, "image/jpeg", JPEG_Q);
      flash("已套上水印，点「保存」入库");
    };
    im.onerror = ()=>flash("这张图读不出来", true);
    im.src = rd.result;
  };
  rd.onerror = ()=>flash("读取失败", true);
  rd.readAsDataURL(f);
  inp.value = "";                      // 允许下次再拍同一张
}
function doVideoToggle(){
  if(recOn){ stopRec(); return; }
  const vd=document.getElementById("vd");
  if(!vd||!vd.videoWidth){flash("相机未就绪",true);return;}
  const _R0=srcRect(), W=Math.max(2,Math.round(_R0.sw)), H=Math.max(2,Math.round(_R0.sh));
  recCanvas.width=W;recCanvas.height=H;
  let mime="";
  const cands=["video/mp4","video/webm","video/webm;codecs=vp9","video/webm;codecs=vp8"];
  for(const c of cands){ if(window.MediaRecorder&&MediaRecorder.isTypeSupported(c)){mime=c;break;} }
  if(!window.MediaRecorder){flash("此浏览器不支持录像（建议用 Chrome/Safari）",true);return;}
  const cv=document.getElementById("wmCv"); cv.style.visibility="hidden";   // 录像走画布逐帧合成，避免双层
  const draw=()=>{ if(!recOn){rafId=null;return;} const R=srcRect();
    recCtx.drawImage(vd,R.sx,R.sy,R.sw,R.sh,0,0,W,H); drawWmAny(recCtx,W,H); rafId=requestAnimationFrame(draw); };
  try{
    const cs=recCanvas.captureStream(24);
    recorder=new MediaRecorder(cs,{mimeType:mime||undefined,videoBitsPerSecond:4_000_000});
  }catch(e){ cv.style.visibility="visible"; flash("录像初始化失败："+e.message,true); return; }
  recChunks=[];
  recorder.ondataavailable=e=>{ if(e.data&&e.data.size) recChunks.push(e.data); };
  recorder.onstop=()=>{ pvKind="video"; const blob=new Blob(recChunks,{type:mime||"video/webm"}); recChunks=[];
    cv.style.visibility="visible"; document.getElementById("timer").classList.remove("rec");
    showPv('<video class="pmedia" controls playsinline src="'+URL.createObjectURL(blob)+'"></video>', blob); };
  recOn=true; recSec=0; document.getElementById("tsec").textContent="00:00";
  document.getElementById("shutter").classList.add("rec"); 
  document.getElementById("timer").classList.add("rec");
  recorder.start(500); recTimer=setInterval(()=>{recSec++;const m=String(Math.floor(recSec/60)).padStart(2,"0"),s=String(recSec%60).padStart(2,"0");document.getElementById("tsec").textContent=m+":"+s;},1000);
  rafId=requestAnimationFrame(draw);
  flash("● 正在录像，再点快门停止");
}

async function saveUp(){
  if(!pvBlob){flash("没有内容",true);return;}
  /* v40：项目名称必填 —— 没填就不让保存，直接把他带到那一栏 */
  const _pjName=(CFG.project||"").trim();
  if(!_pjName){
    flash("请先填「项目名称」（必填，决定相册文件夹）", true);
    try{ openSheet("content"); const e=document.getElementById("edProject"); if(e){ e.scrollIntoView({block:"center"}); e.focus(); } }catch(_){}
    return;
  }
  const st=document.getElementById("st"); st.textContent="上传中…"; st.className="st"; st.style.display="block";
  const isVid=pvKind==="video";
  const blob=pvBlob;
  const meta={project:_pjName,time:nowStr(),area:area,content:content,route:route,weather:weatherText,place:place||placeText,tpl:tplById(wmOpt.tpl).name,who:who,num:wmData().num,coords:coords?coords.lat+","+coords.lng:""};
  const url=(isVid?"/api/video":"/api/photo")+"?"+new URLSearchParams(meta).toString();
  const ext=isVid?((blob.type.indexOf("mp4")>=0)?"mp4":"webm"):"jpg";
  const put=()=>new Promise(res=>{
    const xhr=new XMLHttpRequest();
    xhr.open("POST",url,true);
    xhr.setRequestHeader("Content-Type",isVid?(blob.type||"video/webm"):"image/jpeg");
    xhr.setRequestHeader("X-File-Ext",ext);
    xhr.timeout=300000;
    xhr.upload.onprogress=e=>{ if(e.lengthComputable){ const p=Math.round(e.loaded*100/e.total);
      st.textContent="上传中… "+p+"%（"+(blob.size/1048576).toFixed(2)+"MB）"; } };
    xhr.onload=()=>{ let j={}; try{j=JSON.parse(xhr.responseText);}catch(_){ } res(j); };
    xhr.onerror=()=>res({ok:false,err:"网络错误"});
    xhr.ontimeout=()=>res({ok:false,err:"超时"});
    xhr.send(blob);
  });
  let j=null;
  for(let i=1;i<=3;i++){
    j=await put();
    if(j&&j.ok) break;
    if(i<3){ st.textContent="上传中断，正在重试（"+i+"/3）…"; await new Promise(r=>setTimeout(r,1500*i)); }
  }
  if(j&&j.ok){ st.innerHTML="✅ 已保存（"+(blob.size/1048576).toFixed(2)+"MB）："+j.file; setTimeout(()=>backHome(),1500); }
  else { st.textContent="保存失败："+((j&&j.err)||"网络错误")+"（已重试3次，可再点保存）"; st.classList.add("err"); }
}
